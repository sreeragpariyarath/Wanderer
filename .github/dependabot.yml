version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      framework:
        patterns: ['next', 'react', 'react-dom', '@types/react*']
      testing:
        patterns: ['@playwright/test', 'vitest', 'jsdom']
      lint-and-format:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'prettier']
      cloudflare:
        patterns: ['wrangler']
      minor-and-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
